<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Sky Top Carriers: Consignment desk</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#f7e3e5;--card:#fffafa;--ink:#1c2442;--blue:#1d3a9c;--onblue:#fff;--line:#d9b9c0;--rule:#9fb0dc;--stamp:#d6401f;--ok:#1f7a4d;--mute:#6b5f73;--warn:#9a6200;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);color-scheme:light dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#1b1a26;--card:#262438;--ink:#ecebf5;--blue:#8fa8ff;--onblue:#10152e;--line:#3d3a55;--rule:#4a5a95;--stamp:#ff7a59;--ok:#5fd09a;--mute:#a49fb8;--warn:#e0a948;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#1b1a26;--card:#262438;--ink:#ecebf5;--blue:#8fa8ff;--onblue:#10152e;--line:#3d3a55;--rule:#4a5a95;--stamp:#ff7a59;--ok:#5fd09a;--mute:#a49fb8;--warn:#e0a948;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 Barlow,system-ui,sans-serif}
h1,h2,h3{font-family:"Barlow Condensed","Arial Narrow",sans-serif;margin:0;letter-spacing:.01em}
header{display:flex;gap:14px;align-items:center;padding:14px 20px;background:var(--blue);color:var(--onblue)}
.logo{width:46px;height:46px;border-radius:50%;border:2px solid currentColor;display:grid;place-items:center;font:700 19px "Barlow Condensed",sans-serif}
header h1{font-size:28px;line-height:1}header p{margin:2px 0 0;font-size:13px;opacity:.85}
nav{display:flex;gap:4px;padding:0 14px;border-bottom:2px solid var(--line);overflow-x:auto;background:var(--card)}
nav button{background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-2px;padding:12px 14px;font:600 15px Barlow,sans-serif;color:var(--mute);cursor:pointer;white-space:nowrap}
nav button.on{color:var(--blue);border-color:var(--stamp)}
nav button:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--stamp);outline-offset:2px}
main{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
h2{font-size:26px;color:var(--blue);margin:26px 0 10px}h2:first-child{margin-top:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));border:1px solid var(--line);background:var(--card)}
.kpis div{padding:12px 14px;border-right:1px solid var(--line)}.kpis div:last-child{border:0}
.kpis b{display:block;font:700 34px/1.1 "Barlow Condensed",sans-serif;color:var(--blue)}.kpis span{font-size:13px;color:var(--mute)}
.wrap{overflow-x:auto;border:1px solid var(--line);background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:560px}
th{font:600 13px Barlow,sans-serif;color:var(--mute);text-align:left;padding:8px 10px;border-bottom:2px solid var(--rule)}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tfoot td{font-weight:600;border-top:2px solid var(--rule);border-bottom:0}
.chip{display:inline-block;padding:1px 9px;border-radius:10px;font-size:12.5px;font-weight:600;border:1px solid currentColor}
.Available,.Delivered{color:var(--ok)}.Maintenance,.Received{color:var(--warn)}.In\ transit,.Arrived{color:var(--blue)}
.btn{font:600 14px Barlow,sans-serif;padding:6px 12px;border-radius:4px;border:1px solid var(--blue);background:var(--card);color:var(--blue);cursor:pointer}
.btn.pri{background:var(--blue);color:var(--onblue)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:24px;align-items:start}
@media(max-width:820px){.grid2{grid-template-columns:1fr}}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 3px}
input,select{width:100%;padding:8px 10px;font:15px Barlow,sans-serif;border:1px solid var(--line);border-radius:4px;background:var(--card);color:var(--ink)}
.irow{display:grid;grid-template-columns:60px 1fr 110px;gap:6px;margin-bottom:6px}
.pick{display:flex;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}.pick input{width:auto}
.note{background:var(--card);border:1px solid var(--rule);border-top:6px solid var(--blue);padding:16px 18px;position:relative}
.note .no{font:700 30px "Barlow Condensed",sans-serif;color:var(--stamp)}
.note h3{font-size:22px;color:var(--blue)}.note .row{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--rule);padding:5px 0}
.note table{min-width:0;margin:10px 0}.note td,.note th{border-color:var(--rule)}
.empty{color:var(--mute);padding:18px;border:1px dashed var(--line)}
.trip{margin-bottom:22px}.trip h3{font-size:21px;margin-bottom:6px}
.route{display:flex;min-width:560px;margin:8px 0 14px}
.st{flex:1;text-align:center;position:relative;font-size:13px;color:var(--mute)}
.st i{display:block;width:14px;height:14px;border-radius:50%;border:2px solid var(--rule);background:var(--card);margin:0 auto 5px;position:relative;z-index:1}
.st:before{content:"";position:absolute;top:6px;left:-50%;width:100%;height:2px;background:var(--rule)}.st:first-child:before{display:none}
.st.on i{background:var(--blue);border-color:var(--blue)}.st.on:before{background:var(--blue)}.st.dest span{color:var(--stamp);font-weight:600}
.st.here i{box-shadow:0 0 0 4px var(--line)}
.tl{list-style:none;padding:0;margin:0}.tl li{padding:7px 0 7px 14px;border-left:3px solid var(--rule)}.tl small{color:var(--mute)}
.srch{display:flex;gap:8px;max-width:420px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:4px;display:none;z-index:5}
.muted{color:var(--mute);font-size:13px}
@media print{header,nav,.noprint,#toast{display:none!important}body{background:#fff}main{padding:0}.grid2{display:block}}
</style></head><body>
<header><div class="logo">STC</div><div><h1>Sky Top Carriers</h1><p>Consignment desk, a prototype with sample data</p></div></header>
<nav id="nav"></nav><main id="app"></main><div id="toast" role="status"></div>
<script>
const STOPS=['Nairobi','Wajir','Elwak','Wargadud','Lafey','Rhamu','Mandera'];
const kes=n=>'KES '+n.toLocaleString('en-KE');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const now=()=>new Date().toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
const E=(w,t,d)=>({w,t,d:d||now()});
const C=(no,s,r,ph,dest,items,paid,status,at,trip,ev)=>({no,sender:s,recv:r,phone:ph,dest,items,paid,status,at,trip,ev});
let S={tab:'dash',q:'',last:null,next:5160,tripn:3,
vehicles:[['KDD 834A','Hassan K.','Available'],['KDA 553T','Abdi M.','Available'],['KCX 201M','Yusuf A.','Available'],['KDG 118B','Said O.','Available'],['KCZ 970P','Ali D.','Available'],['KDE 440J','Omar H.','Available'],['KBY 316H','Mohamed N.','Maintenance'],['KDF 762C','Dahir S.','Maintenance']].map(v=>({plate:v[0],driver:v[1],st:v[2]})),
trips:[{id:'T-1',veh:'KDD 834A',stop:1,done:false,ids:[5154,5155,5156]},{id:'T-2',veh:'KDA 553T',stop:4,done:false,ids:[5152,5153]}],
cons:[
C(5152,'Counter sale','Fatuma B.','0712 000 111','Mandera',[{q:3,p:'Sacks of flour',amt:15000}],15000,'In transit',4,'T-2',[E('Nairobi','Received at Nairobi counter','18 Nov 07:40'),E('Nairobi','Loaded on KDA 553T and departed','18 Nov 09:15'),E('Lafey','Passed through Lafey','19 Nov 14:05')]),
C(5153,'Counter sale','Gamadu Shop','0722 000 222','Rhamu',[{q:5,p:'Boxes of goods',amt:17250}],0,'In transit',4,'T-2',[E('Nairobi','Received at Nairobi counter','18 Nov 07:55'),E('Nairobi','Loaded on KDA 553T and departed','18 Nov 09:15'),E('Lafey','Passed through Lafey','19 Nov 14:05')]),
C(5154,'Counter sale','Amina Y.','0733 000 333','Mandera',[{q:4,p:'Mixed goods',amt:10000}],0,'In transit',1,'T-1',[E('Nairobi','Received at Nairobi counter','19 Nov 06:50'),E('Nairobi','Loaded on KDD 834A and departed','19 Nov 08:10'),E('Wajir','Passed through Wajir','20 Nov 16:30')]),
C(5155,'Counter sale','Nimo T.','0711 000 444','Mandera',[{q:1,p:'Carton',amt:2500}],2500,'In transit',1,'T-1',[E('Nairobi','Received at Nairobi counter','19 Nov 07:05'),E('Nairobi','Loaded on KDD 834A and departed','19 Nov 08:10'),E('Wajir','Passed through Wajir','20 Nov 16:30')]),
C(5156,'Counter sale','Zeitun Shop','0720 000 555','Elwak',[{q:2,p:'Boxes of goods',amt:3500}],0,'In transit',1,'T-1',[E('Nairobi','Received at Nairobi counter','19 Nov 07:20'),E('Nairobi','Loaded on KDD 834A and departed','19 Nov 08:10'),E('Wajir','Passed through Wajir','20 Nov 16:30')]),
C(5157,'Counter sale','Ibrahim N.','0701 000 666','Mandera',[{q:1,p:'Parcel',amt:1000}],1000,'Received',0,null,[E('Nairobi','Received at Nairobi counter','21 Nov 07:30')]),
C(5158,'Counter sale','Bishar A.','0799 000 777','Wajir',[{q:6,p:'Rolls of fabric',amt:47700}],0,'Received',0,null,[E('Nairobi','Received at Nairobi counter','21 Nov 08:05')]),
C(5159,'Counter sale','Mohamed S.','0710 000 888','Mandera',[{q:2,p:'Back draw',amt:1200}],1200,'Received',0,null,[E('Nairobi','Received at Nairobi counter','21 Nov 08:20')])]};
const tot=c=>c.items.reduce((a,i)=>a+i.amt,0), pcs=c=>c.items.reduce((a,i)=>a+i.q,0), bal=c=>tot(c)-c.paid;
const con=n=>S.cons.find(c=>c.no==n), trip=id=>S.trips.find(t=>t.id==id);
const vstat=v=>S.trips.some(t=>t.veh==v.plate&&!t.done)?'In transit':v.st;
const chip=s=>`<span class="chip ${s}">${s}</span>`;
const $=s=>document.querySelector(s);
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',2600)}
function go(t){S.tab=t;render()}
function goTrack(no){S.q='STC-'+no;S.tab='track';render();scrollTo(0,0)}
function togv(p){const v=S.vehicles.find(x=>x.plate==p);v.st=v.st=='Available'?'Maintenance':'Available';render()}
function give(n){const c=con(n);c.paid=tot(c);c.status='Delivered';c.ev.push(E(c.dest,'Handed over to receiver, balance collected'));render();toast('STC-'+n+' marked delivered')}
function adv(id){const t=trip(id);t.stop++;const here=STOPS[t.stop];
 t.ids.forEach(n=>{const c=con(n);if(c.status!='In transit')return;c.at=t.stop;
  if(c.dest==here){c.status='Arrived';c.ev.push(E(here,'Arrived at '+here+' branch, ready for collection'))}else c.ev.push(E(here,'Passed through '+here))});
 if(t.stop==STOPS.length-1||t.ids.every(n=>con(n).status!='In transit')){t.done=true;toast(t.veh+' is free again at '+here)}
 render()}
function dispatch(){const p=$('#dv').value,ids=[...document.querySelectorAll('.ld:checked')].map(x=>+x.value);
 if(!p||!ids.length)return toast('Pick a truck and at least one consignment.');
 const t={id:'T-'+S.tripn++,veh:p,stop:0,done:false,ids};S.trips.push(t);
 ids.forEach(n=>{const c=con(n);c.trip=t.id;c.status='In transit';c.at=0;c.ev.push(E('Nairobi','Loaded on '+p+' and departed'))});
 render();toast(t.id+' dispatched on '+p)}
function addRow(){$('#items').insertAdjacentHTML('beforeend','<div class="irow"><input class="iq" type="number" min="1" value="1" aria-label="Quantity"><input class="ip" placeholder="Particulars" aria-label="Particulars"><input class="ia" type="number" min="0" placeholder="Amount" aria-label="Amount in KES"></div>')}
function save(){const items=[...document.querySelectorAll('.irow')].map(r=>({q:+r.querySelector('.iq').value||1,p:r.querySelector('.ip').value.trim(),amt:+r.querySelector('.ia').value||0})).filter(i=>i.p&&i.amt>0);
 const recv=$('#rn').value.trim();if(!recv||!items.length)return toast('Add a receiver and at least one item with an amount.');
 const c=C(S.next++,$('#sn').value.trim()||'Counter sale',recv,$('#rp').value.trim(),$('#rd').value,items,Math.min(+$('#pd').value||0,items.reduce((a,i)=>a+i.amt,0)),'Received',0,null,[E('Nairobi','Received at Nairobi counter')]);
 S.cons.push(c);S.last=c.no;render();toast('Created STC-'+c.no)}
function noteHtml(c){return `<div class="note"><div class="row" style="border:0"><h3>Consignment note</h3><span class="no">No. ${c.no}</span></div>
<div class="row"><span>Sender</span><b>${esc(c.sender)}</b></div><div class="row"><span>Receiver</span><b>${esc(c.recv)} ${esc(c.phone)}</b></div>
<div class="row"><span>Route</span><b>Nairobi to ${c.dest}</b></div>
<table><thead><tr><th>Qty</th><th>Particulars</th><th class="n">Shs.</th></tr></thead><tbody>${c.items.map(i=>`<tr><td>${i.q}</td><td>${esc(i.p)}</td><td class="n">${i.amt.toLocaleString('en-KE')}</td></tr>`).join('')}</tbody>
<tfoot><tr><td colspan="2">Total</td><td class="n">${tot(c).toLocaleString('en-KE')}</td></tr></tfoot></table>
<div class="row"><span>Paid</span><b>${kes(c.paid)}</b></div><div class="row"><span>Balance on delivery</span><b>${kes(bal(c))}</b></div>
<p class="muted">Tracking number <b>STC-${c.no}</b>. Goods carried at owner’s risk. Claims in writing within 15 days.</p></div>`}
function route(at,dest){return '<div style="overflow-x:auto"><div class="route">'+STOPS.map((s,i)=>`<div class="st ${i<=at?'on':''} ${i==at?'here':''} ${s==dest?'dest':''}"><i></i><span>${s}</span></div>`).join('')+'</div></div>'}
function dash(){const vs=S.vehicles.map(v=>vstat(v)),n=k=>vs.filter(x=>x==k).length;
 return `<h2>Fleet today</h2><div class="kpis"><div><b>${vs.length}</b><span>Trucks in total</span></div><div><b>${n('In transit')}</b><span>On the road</span></div><div><b>${n('Available')}</b><span>Ready to load</span></div><div><b>${n('Maintenance')}</b><span>In maintenance</span></div><div><b>${S.cons.filter(c=>c.status=='Received').length}</b><span>Waiting to load</span></div><div><b>${S.cons.reduce((a,c)=>a+bal(c),0).toLocaleString('en-KE')}</b><span>KES still to collect</span></div></div>
<h2>Trucks</h2><div class="wrap"><table><thead><tr><th>Plate</th><th>Driver</th><th>Status</th><th>Trip</th><th></th></tr></thead><tbody>${S.vehicles.map(v=>{const s=vstat(v),t=S.trips.find(t=>t.veh==v.plate&&!t.done);return `<tr><td><b>${v.plate}</b></td><td>${v.driver}</td><td>${chip(s)}</td><td>${t?t.id+' at '+STOPS[t.stop]:''}</td><td>${s=='In transit'?'':`<button class="btn" onclick="togv('${v.plate}')">${s=='Available'?'Send to maintenance':'Mark available'}</button>`}</td></tr>`}).join('')}</tbody></table></div>
<h2>Consignments</h2><div class="wrap"><table><thead><tr><th>Tracking no.</th><th>Receiver</th><th>To</th><th>Status</th><th class="n">Total</th><th class="n">Balance</th><th></th></tr></thead><tbody>${[...S.cons].reverse().map(c=>`<tr><td><b>STC-${c.no}</b></td><td>${esc(c.recv)}</td><td>${c.dest}</td><td>${chip(c.status)}</td><td class="n">${tot(c).toLocaleString('en-KE')}</td><td class="n">${bal(c).toLocaleString('en-KE')}</td><td><button class="btn" onclick="goTrack(${c.no})">Track</button> ${c.status=='Arrived'?`<button class="btn pri" onclick="give(${c.no})">Hand over</button>`:''}</td></tr>`).join('')}</tbody></table></div>`}
function newc(){const c=S.last&&con(S.last);
 return `<div class="grid2 noprint-wrap"><div class="noprint"><h2>New consignment</h2>
<label for="sn">Sender (optional)</label><input id="sn" placeholder="Name of sender">
<label for="rn">Receiver</label><input id="rn" placeholder="Name of receiver">
<label for="rp">Receiver phone (for SMS updates)</label><input id="rp" type="tel" placeholder="07xx xxx xxx">
<label for="rd">Destination</label><select id="rd">${STOPS.slice(1).map(s=>`<option ${s=='Mandera'?'selected':''}>${s}</option>`).join('')}</select>
<label>Items</label><div id="items"><div class="irow"><input class="iq" type="number" min="1" value="1" aria-label="Quantity"><input class="ip" placeholder="Particulars" aria-label="Particulars"><input class="ia" type="number" min="0" placeholder="Amount" aria-label="Amount in KES"></div></div>
<button class="btn" type="button" onclick="addRow()">Add another item</button>
<label for="pd">Paid now (KES)</label><input id="pd" type="number" min="0" value="0">
<p><button class="btn pri" onclick="save()">Create consignment</button></p></div>
<div><h2 class="noprint">Receipt</h2>${c?noteHtml(c)+`<p class="noprint"><button class="btn pri" onclick="print()">Print note</button> <button class="btn" onclick="goTrack(${c.no})">Open tracking</button></p>`:'<div class="empty">Create a consignment and its note appears here, ready to print.</div>'}</div></div>`}
function manifest(t){const cs=t.ids.map(con);const done=t.done;
 return `<div class="trip"><h3>${t.id}: ${t.veh} ${done?'<span class="chip Delivered">Completed</span>':''}</h3>${route(t.stop,'')}
<div class="wrap"><table><thead><tr><th>RN</th><th>Receiver</th><th>To</th><th class="n">Pieces</th><th class="n">Cash paid</th><th class="n">Balance</th><th>Status</th></tr></thead><tbody>${cs.map(c=>`<tr><td>${c.no}</td><td>${esc(c.recv)}</td><td>${c.dest}</td><td class="n">${pcs(c)}</td><td class="n">${c.paid.toLocaleString('en-KE')}</td><td class="n">${bal(c).toLocaleString('en-KE')}</td><td>${chip(c.status)}</td></tr>`).join('')}</tbody>
<tfoot><tr><td colspan="3">Total</td><td class="n">${cs.reduce((a,c)=>a+pcs(c),0)}</td><td class="n">${cs.reduce((a,c)=>a+c.paid,0).toLocaleString('en-KE')}</td><td class="n">${cs.reduce((a,c)=>a+bal(c),0).toLocaleString('en-KE')}</td><td></td></tr></tfoot></table></div>
${done?'':`<p><button class="btn pri" onclick="adv('${t.id}')">Truck reached ${STOPS[t.stop+1]}</button></p>`}</div>`}
function trips(){const free=S.vehicles.filter(v=>vstat(v)=='Available'),wait=S.cons.filter(c=>c.status=='Received');
 return `<div class="grid2"><div><h2>Load a truck</h2><label for="dv">Truck</label><select id="dv">${free.length?free.map(v=>`<option>${v.plate}</option>`).join(''):'<option value="">No truck available</option>'}</select>
<label>Consignments waiting at Nairobi</label>${wait.length?wait.map(c=>`<label class="pick"><input type="checkbox" class="ld" value="${c.no}"> <span>STC-${c.no}: ${esc(c.recv)} to ${c.dest} (${kes(tot(c))})</span></label>`).join(''):'<div class="empty">Nothing waiting. Create a consignment first.</div>'}
<p><button class="btn pri" onclick="dispatch()">Dispatch trip</button></p><p class="muted">A consignment can sit on one active trip only. Loading it moves it out of this list.</p></div>
<div><h2>Trip manifests</h2>${[...S.trips].reverse().map(manifest).join('')}</div></div>`}
function track(){const q=S.q.trim().replace(/^stc-?/i,''),c=q&&con(q);
 let r='';if(q&&!c)r='<div class="empty">No consignment with that number. Check the digits on the receipt, for example STC-5159.</div>';
 if(c)r=`<div class="trip"><h2>STC-${c.no} ${chip(c.status)}</h2><p>${esc(c.recv)}, Nairobi to ${c.dest}${c.trip?', on '+trip(c.trip).veh:', not yet loaded'}.</p>${route(c.at,c.dest)}
<p>Total ${kes(tot(c))}, paid ${kes(c.paid)}, balance <b>${kes(bal(c))}</b>.</p><h3>History</h3><ul class="tl">${[...c.ev].reverse().map(e=>`<li><b>${e.w}</b>: ${e.t}<br><small>${e.d}</small></li>`).join('')}</ul></div>`;
 return `<h2>Track a consignment</h2><div class="srch"><input id="tq" value="${esc(S.q)}" placeholder="STC-5154" aria-label="Tracking number" onkeydown="if(event.key=='Enter')doTrack()"><button class="btn pri" onclick="doTrack()">Track</button></div>${r}${q?'':'<p class="muted">Enter the number printed on the receipt. Try STC-5154 or STC-5152.</p>'}`}
function doTrack(){S.q=$('#tq').value;render()}
function render(){const T=[['dash','Dashboard'],['new','New consignment'],['trips','Trips and manifests'],['track','Track']];
 $('#nav').innerHTML=T.map(t=>`<button class="${S.tab==t[0]?'on':''}" onclick="go('${t[0]}')">${t[1]}</button>`).join('');
 $('#app').innerHTML={dash,new:newc,trips,track}[S.tab]()}
render();
</script></body></html>
